<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3fb"><title>AY Asansör · Etkileşim prototipi</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172439;background:#e9eff8;font-synthesis:none;--blue:#176ce4;--muted:#77859b;--line:#e2e8f1}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:active{transform:scale(.97);filter:brightness(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #70adff;outline-offset:3px}button{transition:transform .13s,background .18s;border:0}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.app{position:relative;width:100%;max-width:520px;margin:auto;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at top right,#dce9ff,transparent 65%),#f0f4fa}.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .3s;background:linear-gradient(145deg,#edf3fd,#f5f7fb)}.bar{display:flex;gap:13px;align-items:center;padding:calc(15px + env(safe-area-inset-top)) 20px 12px;flex:none;background:#f1f5facf;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:2}.bar h1{font-size:26px;letter-spacing:-1px;margin:0 0 3px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}.grow{flex:1;min-width:0}.icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#ffffffd9;color:#24334b;box-shadow:0 2px 10px #20365e08;border:1px solid #e0e7f1}.avatar{background:#183e73;color:white;font-size:12px;font-weight:750;border-radius:50%;width:38px;height:38px}.scroll{overflow:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:8px 18px 120px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:4px 5px 4px 14px;border-radius:19px;margin-bottom:16px;color:#78869c}.search input{min-width:0;width:100%;border:0;background:none;outline:none;padding:12px 0;font-size:16px;color:#172439}.search .icon{background:#edf4ff;border:0;color:var(--blue)}.hero{background:linear-gradient(115deg,#101d34,#1d4f8d 80%,#2366b4);color:white;padding:22px;border-radius:25px;box-shadow:0 14px 28px #17376319;position:relative;overflow:hidden}.hero:after{content:'';width:180px;height:180px;border:1px solid #ffffff0f;border-radius:50%;position:absolute;right:-65px;top:-75px;pointer-events:none}.hero .eyebrow{color:#adc7e9}.hero h2{font-size:23px;letter-spacing:-.7px;margin:7px 0}.hero p{color:#b8cbe4;font-size:12px;line-height:1.6;margin:0}.row{display:flex;align-items:center;gap:12px}.ring{width:66px;height:66px;display:grid;place-content:center;text-align:center;border:4px solid #729acf55;border-radius:50%;flex:none;font-weight:750;font-size:18px}.ring small{font-size:9px;color:#b8cbe4}.track{height:4px;border-radius:4px;background:#ffffff22;margin:19px 0}.track span{display:block;background:#8bbdff;height:100%;border-radius:4px;transition:width .3s}.hero button{padding:13px 16px;border-radius:13px;background:#fff;color:#18569f;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:13px}.summary{margin:14px 0 22px;background:#ffffffb8;border:1px solid #fff;border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary small{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.7px;margin-bottom:6px}.summary strong{font-size:21px;letter-spacing:-.4px}.summary div+div{border-left:1px solid var(--line);padding-left:18px}.purple{color:#7651c6}.section{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 12px}.section h2{font-size:19px;letter-spacing:-.5px;margin:0}.link{background:none;color:var(--blue);font-size:12px;padding:12px 4px;font-weight:700}.card{display:block;width:100%;text-align:left;background:#ffffffdc;border:1px solid #dde5ef;border-radius:22px;margin:0 0 12px;padding:17px 17px 14px;position:relative;overflow:hidden;color:inherit;box-shadow:0 4px 12px #1e355504}.card:before{content:'';position:absolute;left:0;top:25px;bottom:25px;width:3px;border-radius:3px;background:#dcaf58}.card.done:before{background:#2b9b6a}.building{display:grid;place-items:center;width:42px;height:46px;border-radius:14px;background:#fbf4e6;color:#bf8e34;flex:none}.card h3{font-size:17px;letter-spacing:-.4px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);line-height:1.5}.badge{font-size:10px;line-height:1.3;padding:8px 9px;border-radius:10px;background:#eef1f7;color:#64738a;font-weight:750;white-space:nowrap}.badge.green{background:#e8f5ee;color:#258351}.facts{display:flex;border-top:1px solid var(--line);margin-top:14px;padding-top:11px;gap:10px}.facts div{flex:1}.facts small{font-size:9px;display:block;letter-spacing:.9px;color:var(--muted);font-weight:700;margin-bottom:4px}.facts strong{font-size:13px}.facts svg{align-self:center;color:#8b98ab;width:16px}.demo{font-size:10px;color:#8592a6;text-align:center;margin:18px 0;line-height:1.7}.tabs{position:absolute;z-index:5;bottom:calc(16px + env(safe-area-inset-bottom));left:9%;right:9%;display:flex;padding:5px;background:#ffffffc4;border:1px solid #ffffff;border-radius:25px;box-shadow:0 14px 35px #1b355a23,0 0 0 1px #dce4ef;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:transform .25s,opacity .25s}.tabs button{display:flex;justify-content:center;align-items:center;gap:8px;flex:1;background:none;padding:17px 5px;border-radius:20px;font-size:13px;font-weight:750;color:#707e92}.tabs button.active{color:white;background:linear-gradient(120deg,#153660,#176de5);box-shadow:0 6px 13px #176de52a}.detail{transform:translateX(105%);z-index:6}.app.in-detail .detail{transform:translateX(0)}.app.in-detail #home{transform:translateX(-24%);opacity:.45}.app.in-detail .tabs{transform:translateY(130%);opacity:0;pointer-events:none}.detail .bar h1{font-size:16px;letter-spacing:-.3px}.detail .scroll{padding-bottom:35px}.detailhero{text-align:center;padding:23px 0}.detailhero .building{margin:0 auto 15px;width:62px;height:64px;background:#e0ebfc;color:var(--blue);border-radius:21px}.detailhero h2{font-size:29px;letter-spacing:-1px;margin:0 0 6px}.group{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 17px;margin-bottom:16px}.item{display:flex;align-items:center;gap:12px;padding:16px 0}.item+.item{border-top:1px solid var(--line)}.item svg{color:#7490b6}.item strong{display:block;font-size:14px;margin-bottom:4px}.item .right{margin-left:auto;text-align:right;font-weight:700;font-size:14px}.primary{width:100%;border-radius:17px;background:linear-gradient(110deg,#183a65,#176fe9);padding:17px;color:white;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 24px}.secondary{background:#e4edfb;color:#205799;padding:15px 10px;border-radius:16px;font-size:13px;font-weight:700}.timeline{padding:0 6px}.event{position:relative;padding:0 0 22px 24px;border-left:1px solid #d7e0ed;margin-left:5px}.event:before{content:'';position:absolute;width:7px;height:7px;background:#3479cf;border:3px solid #edf3fc;border-radius:50%;left:-7px;top:0}.event strong{font-size:13px}.event p{font-size:12px;color:var(--muted);margin:5px 0}.overlay{position:absolute;inset:0;z-index:10;background:#0c193966;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;display:flex;align-items:flex-end}.overlay.open{opacity:1;visibility:visible}.sheet{width:100%;max-height:90%;overflow:auto;background:#f5f7fb;border-radius:29px 29px 0 0;padding:10px 23px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.85,.2,1);box-shadow:0 -12px 50px #0e203a20}.open .sheet{transform:translateY(0)}.handle{width:35px;height:5px;background:#cbd3df;border-radius:5px;margin:0 auto 16px}.sheet h2{font-size:23px;letter-spacing:-.7px;margin:0}.sheet p{font-size:13px;line-height:1.6;color:var(--muted)}.sheet label{display:block;font-size:12px;font-weight:650;margin:17px 0 7px}.sheet textarea,.sheet input{width:100%;border:1px solid #dbe3ef;border-radius:15px;padding:14px;background:white;color:#172439;font-size:16px}.sheet textarea{min-height:95px;resize:vertical}.sheet .primary{margin-top:18px}.option{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 12px;margin-top:8px;border:1px solid #dce5f1;border-radius:14px;background:white;text-align:left;color:#243b5a}.option.chosen{background:#e5efff;border-color:#5e95e3;color:#1761c3}.toast{position:absolute;top:calc(15px + env(safe-area-inset-top));left:20px;right:20px;z-index:20;padding:16px;background:#142b49;color:#fff;border-radius:17px;box-shadow:0 8px 28px #18345233;font-size:13px;text-align:center;transform:translateY(-180%);opacity:0;transition:.25s;pointer-events:none}.toast.show{transform:translateY(0);opacity:1}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:14px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}@media(min-width:600px){body{background:#dce5f1}.app{border-inline:1px solid #c8d4e5;box-shadow:0 0 90px #23375c19}}
</style></head><body>
<svg aria-hidden="true" style="display:none"><defs><symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol><symbol id="next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="building" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 6h.01M15 6h.01M9 10h.01M15 10h.01M9 14h.01M15 14h.01M10 22v-4h4v4"/></symbol><symbol id="check" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></symbol><symbol id="filter" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><rect x="8" y="4" width="4" height="6" rx="2"/><rect x="14" y="14" width="4" height="6" rx="2"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M16 11h5v5h-5a2.5 2.5 0 0 1 0-5ZM5 5V3h13"/></symbol><symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></defs></svg>
<main class="app" id="app">
<section class="screen" id="home" aria-label="Portföy"><header class="bar"><button class="icon" id="menuBtn" aria-label="Menüyü aç"><svg><use href="#menu"/></svg></button><div class="grow"><h1 id="pageTitle">Portföy</h1><div class="eyebrow">AY ASANSÖR · TASARIM DENEMESİ</div></div><button class="icon avatar" id="profileBtn" aria-label="Prototip hakkında">UA</button></header><div class="scroll" id="homeScroll"><div class="search"><svg><use href="#search"/></svg><input id="searchInput" type="search" placeholder="Portföyde ara…" aria-label="Apartman ara"><button id="filterBtn" class="icon" aria-label="Filtrele"><svg><use href="#filter"/></svg></button></div><div class="hero"><div class="row"><div class="grow"><div class="eyebrow">EYLÜL 2026</div><h2>Kolay gelsin, Uğur</h2><p id="progressText"></p></div><div class="ring"><span id="percent">0%</span><small>BAKIM</small></div></div><div class="track"><span id="progressBar"></span></div><button id="planBtn"><svg><use href="#check"/></svg><span>Bakım planına geç</span><svg><use href="#next"/></svg></button></div><div class="summary"><div><small>BU AY TAHSİLAT</small><strong id="total"></strong></div><div><small>AÇIK BAKİYE</small><strong class="purple" id="balance"></strong></div></div><div class="section"><h2 id="listTitle">Apartmanlar</h2><button class="link" id="sortBtn">A–Z sırala</button></div><div id="cards"></div><p class="demo">Örnek veriler · Canlı uygulamaya bağlı değildir.<br>Deneme işlemleri sayfa yenilenince sıfırlanır.</p></div></section>
<nav class="tabs" id="tabs" aria-label="Ana gezinme"><button id="maintenanceTab"><svg><use href="#check"/></svg>Bakım</button><button class="active" id="portfolioTab"><svg><use href="#building"/></svg>Apartmanlar</button></nav>
<section class="screen detail" id="detail" aria-label="Apartman detayı" inert><header class="bar"><button class="icon" id="backBtn" aria-label="Portföye dön"><svg><use href="#back"/></svg></button><div class="grow"><h1>Apartman detayı</h1><div class="eyebrow">ÖRNEK KAYIT</div></div><button class="icon" id="moreBtn" aria-label="İşlemleri aç"><svg><use href="#menu"/></svg></button></header><div class="scroll" id="detailScroll"></div></section>
<div class="overlay" id="overlay"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="handle"></div><div class="row"><h2 class="grow" id="sheetTitle"></h2><button id="closeSheet" class="icon" aria-label="Paneli kapat"><svg><use href="#close"/></svg></button></div><div id="sheetBody"></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),icon=name=>'<svg aria-hidden="true"><use href="#'+name+'"/></svg>',money=n=>n.toLocaleString('tr-TR')+' ₺';
const records=[{id:1,name:'ŞEN APT',manager:'İsmail Şen',code:'EX-SEN-001',date:'20.09.26',paid:4000,balance:0,done:false},{id:2,name:'BELEDİYE EVLERİ',manager:'Örnek yönetici',code:'EX-BEL-002',date:'12.09.26',paid:3000,balance:0,done:false},{id:3,name:'YÖREM EKMEK APT',manager:'Örnek yönetici',code:'EX-YOR-003',date:'03.09.26',paid:1000,balance:0,done:false},{id:4,name:'Melek apt',manager:'Örnek yönetici',code:'EX-MLK-004',date:'10.09.26',paid:0,balance:900,done:false},{id:5,name:'Deneme alt',manager:'Uğur Ay',code:'EX-DNM-005',date:'15.09.26',paid:1000,balance:0,done:false}];
let selected=null,tab='portfolio',filter='all',sort=false,lastFocus=null,sheetFocus=null,timer;
function render(){const done=records.filter(r=>r.done).length;$('progressText').textContent=records.length+' örnek apartman · '+(records.length-done)+' bakım bekliyor';$('percent').textContent=Math.round(done/records.length*100)+'%';$('progressBar').style.width=done/records.length*100+'%';$('total').textContent=money(records.reduce((s,r)=>s+r.paid,0));$('balance').textContent=money(records.reduce((s,r)=>s+r.balance,0));$('pageTitle').textContent=tab==='portfolio'?'Portföy':'Bakım Planı';$('listTitle').textContent=tab==='portfolio'?'Apartmanlar':'Bekleyen bakımlar';$('planBtn').querySelector('span').textContent=tab==='portfolio'?'Bakım planına geç':'Portföye dön';$('maintenanceTab').classList.toggle('active',tab==='maintenance');$('portfolioTab').classList.toggle('active',tab==='portfolio');$('maintenanceTab').setAttribute('aria-current',tab==='maintenance'?'page':'false');$('portfolioTab').setAttribute('aria-current',tab==='portfolio'?'page':'false');let q=$('searchInput').value.toLocaleLowerCase('tr-TR');let list=records.filter(r=>r.name.toLocaleLowerCase('tr-TR').includes(q)&&(tab!=='maintenance'||!r.done)&&(filter!=='debt'||r.balance>0)&&(filter!=='done'||r.done));if(sort)list.sort((a,b)=>a.name.localeCompare(b.name,'tr'));$('cards').innerHTML=list.map(r=>'<button class="card '+(r.done?'done':'')+'" data-record="'+r.id+'"><div class="row"><div class="building">'+icon('building')+'</div><div class="grow"><h3>'+r.name+'</h3><div class="sub">'+r.code+'</div></div><span class="badge '+(r.done?'green':'')+'">'+(r.done?'Tamamlandı':'Beklemede')+'</span></div><div class="sub" style="margin:11px 0 0 54px">'+r.manager+'</div><div class="facts"><div><small>PLAN</small><strong>'+r.date+'</strong></div><div><small>TAHSİLAT</small><strong>'+money(r.paid)+'</strong></div><div><small>KALAN</small><strong style="color:'+(r.balance?'#7651c6':'#258351')+'">'+money(r.balance)+'</strong></div>'+icon('next')+'</div></button>').join('')||'<div class="empty">Bu filtrede apartman bulunamadı.</div>';}
function detailRender(){let r=selected;$('detailScroll').innerHTML='<div class="detailhero"><div class="building">'+icon('building')+'</div><h2>'+r.name+'</h2><div class="sub">'+r.code+' · Örnek apartman</div></div><div class="group"><div class="item">'+icon('person')+'<div><strong>'+r.manager+'</strong><div class="sub">Apartman yöneticisi</div></div></div><div class="item">'+icon('clock')+'<div><strong>'+r.date+'</strong><div class="sub">Planlanan bakım</div></div><span class="badge '+(r.done?'green':'')+'">'+(r.done?'Tamamlandı':'Beklemede')+'</span></div><div class="item">'+icon('wallet')+'<div><strong>Açık bakiye</strong><div class="sub">Örnek cari hesabı</div></div><span class="right purple">'+money(r.balance)+'</span></div></div><button class="primary" data-action="maintenance">'+icon('check')+(r.done?'Bakım kaydını görüntüle':'Bakımı başlat')+'</button><div class="detail-actions"><button class="secondary" data-action="payment">Tahsilat dene</button><button class="secondary" data-action="note">Not ekle</button></div><div class="section"><h2>Son hareketler</h2><span class="eyebrow">ÖRNEK</span></div><div class="timeline">'+(r.note?'<div class="event"><strong>Yeni not</strong><p id="savedNote"></p></div>':'')+(r.done?'<div class="event"><strong>Bakım tamamlandı</strong><p>Az önce · Prototip işlemi</p></div>':'')+'<div class="event"><strong>Bakım planı oluşturuldu</strong><p>Eylül 2026 · '+r.date+'</p></div><div class="event"><strong>Apartman portföye eklendi</strong><p>Örnek başlangıç kaydı</p></div></div>';if(r.note)$('savedNote').textContent=r.note;}
function openDetail(id){selected=records.find(r=>r.id===id);lastFocus=document.activeElement;detailRender();$('detailScroll').scrollTop=0;$('detail').inert=false;$('home').inert=true;$('tabs').inert=true;$('app').classList.add('in-detail');$('backBtn').focus({preventScroll:true});}
function goBack(){closePanel(false);$('detail').inert=true;$('home').inert=false;$('tabs').inert=false;$('app').classList.remove('in-detail');if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});}
function openPanel(title,html){sheetFocus=document.activeElement;$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('overlay').classList.add('open');$('home').inert=true;$('detail').inert=true;$('tabs').inert=true;$('sheet').focus({preventScroll:true});}
function closePanel(restore=true){$('overlay').classList.remove('open');const inDetail=$('app').classList.contains('in-detail');$('home').inert=inDetail;$('detail').inert=!inDetail;$('tabs').inert=inDetail;if(restore&&sheetFocus&&sheetFocus.isConnected)sheetFocus.focus({preventScroll:true});}
function toast(text){clearTimeout(timer);$('toast').textContent=text;$('toast').classList.add('show');timer=setTimeout(()=>$('toast').classList.remove('show'),2800);}
function action(kind){if(kind==='maintenance'){if(selected.done){openPanel('Bakım kaydı','<p>Bu örnek apartmanın bakımı prototipte tamamlandı. Gerçek bakım veya borç kaydı oluşturulmadı.</p>');return;}openPanel('Bakımı tamamla','<p>'+selected.name+' · Bu işlem yalnız deneme içindir. Gerçek teknik kontrol listesi veya borç oluşturmaz.</p><label for="maintenanceNote">Bakım notu</label><textarea id="maintenanceNote" placeholder="Örnek bakım notunu yaz…"></textarea><button class="primary" data-save="maintenance">Deneme bakımını tamamla</button>');}if(kind==='payment')openPanel('Tahsilat denemesi','<p>'+selected.name+' · Açık bakiye: '+money(selected.balance)+'. Gerçek ödeme alınmaz.</p><label for="amount">Tutar (₺)</label><input id="amount" type="text" inputmode="decimal" placeholder="Örn. 900" autocomplete="off"><p id="paymentError" role="alert" style="color:#b23c43"></p><button class="primary" data-save="payment">Deneme tahsilatını kaydet</button>');if(kind==='note')openPanel('Apartman notu','<p>Not yalnız bu açık prototipte tutulur.</p><label for="note">Notun</label><textarea id="note" maxlength="1000" placeholder="Buraya yaz…"></textarea><button class="primary" data-save="note">Notu kaydet</button>');}
$('cards').addEventListener('click',e=>{let b=e.target.closest('[data-record]');if(b)openDetail(Number(b.dataset.record));});$('detailScroll').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action);});$('backBtn').onclick=goBack;$('closeSheet').onclick=()=>closePanel();$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel();};$('searchInput').oninput=render;
function switchTab(value){tab=value;render();$('homeScroll').scrollTop=0;}$('maintenanceTab').onclick=()=>switchTab('maintenance');$('portfolioTab').onclick=()=>switchTab('portfolio');$('planBtn').onclick=()=>switchTab(tab==='portfolio'?'maintenance':'portfolio');$('sortBtn').onclick=()=>{sort=!sort;$('sortBtn').textContent=sort?'Plan sırası':'A–Z sırala';render();};
$('filterBtn').onclick=()=>openPanel('Portföyü filtrele','<p>Görmek istediğin kayıtları seç.</p>'+[['all','Tüm apartmanlar'],['debt','Açık bakiyesi olanlar'],['done','Bakımı tamamlananlar']].map(([id,label])=>'<button class="option '+(filter===id?'chosen':'')+'" data-filter="'+id+'">'+label+(filter===id?icon('check'):icon('next'))+'</button>').join(''));
$('moreBtn').onclick=()=>openPanel('Apartman işlemleri','<p>'+selected.name+'</p><button class="option" data-action="maintenance">Bakım'+icon('check')+'</button><button class="option" data-action="payment">Tahsilat'+icon('wallet')+'</button><button class="option" data-action="note">Not ekle'+icon('next')+'</button>');
function about(){openPanel('Bu bir tasarım denemesi','<p>AY Asansör’ün lacivert–mavi kimliğini koruyan etkileşim prototipi.</p><div class="group"><div class="item"><div><strong>Ekran geçişlerini dene</strong><div class="sub">Apartman kartına dokun, geri dön.</div></div></div><div class="item"><div><strong>İşlem panelini dene</strong><div class="sub">Bakım, tahsilat veya not aç.</div></div></div></div><p>Supabase bağlantısı, gerçek veri erişimi ve kalıcı kayıt yoktur. Yenileyince bütün denemeler sıfırlanır.</p>');}$('profileBtn').onclick=about;$('menuBtn').onclick=about;
$('sheetBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;render();closePanel();}if(b.dataset.action)action(b.dataset.action);if(b.dataset.save){let kind=b.dataset.save;if(kind==='maintenance'){selected.done=true;let note=$('maintenanceNote').value.trim();if(note)selected.note=note;}if(kind==='note'){let note=$('note').value.trim();if(!note){$('note').focus();return;}selected.note=note;}if(kind==='payment'){let raw=$('amount').value.trim();let n=Number(raw.replace(',','.'));if(!/^\d+(?:[.,]\d{1,2})?$/.test(raw)||!Number.isFinite(n)||n<=0||n>selected.balance){$('paymentError').textContent=selected.balance===0?'Bu örnek kaydın açık bakiyesi yok. Melek apt üzerinde deneyebilirsin.':'0 ile '+money(selected.balance)+' arasında, kuruş için virgül kullanarak bir tutar gir.';return;}selected.paid=Math.round((selected.paid+n)*100)/100;selected.balance=Math.round((selected.balance-n)*100)/100;}render();detailRender();closePanel(false);$('moreBtn').focus({preventScroll:true});toast('Deneme kaydedildi · Gerçek veriler değişmedi');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('overlay').classList.contains('open'))closePanel();else if($('app').classList.contains('in-detail'))goBack();}if(e.key==='Tab'&&$('overlay').classList.contains('open')){const items=[...$('sheet').querySelectorAll('button,input,textarea')];const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
if(window.visualViewport){const fit=()=>{document.querySelector('.app').style.height=visualViewport.height+'px';};visualViewport.addEventListener('resize',fit);fit();}render();
</script></body></html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111f">
<title>ElevatorX Aktivasyon</title>
<!-- ELEVATORX_V1475_LICENSE_GATE | APP_VERSION v1.4.75 | APP_FILE app.html -->
<script>const APP_VERSION = "v1.4.75";</script>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=1475">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1475">
<link rel="manifest" href="/manifest.webmanifest?v=1475">
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#101827;--line:rgba(148,163,184,.18);--text:#f8fafc;--muted:#9aa7bd;--blue:#0a84ff;--green:#20c997;--red:#ff5d6c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#07111f;color:var(--text);}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 22px);background:radial-gradient(circle at 50% 8%,rgba(10,132,255,.22),transparent 36%),linear-gradient(180deg,#06101d,#080d16 72%,#050913);}
.card{width:min(440px,100%);border-radius:34px;padding:26px 24px;background:rgba(15,23,42,.88);border:1px solid var(--line);box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
.logo{width:78px;height:78px;border-radius:25px;margin:0 auto 16px;background:linear-gradient(180deg,#f8fbff,#e7eef8);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 46px rgba(0,0,0,.26);font-size:38px;font-weight:950;letter-spacing:-2px;color:#0b1324;}
.logo span{color:#0a84ff}
h1{margin:0;text-align:center;font-size:32px;letter-spacing:-1.2px;line-height:1.05;font-weight:950}
h1 span{color:#0a84ff}
.sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.45;font-weight:700;margin:10px auto 20px;max-width:350px;}
.deviceBox{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:24px;padding:15px;margin:14px 0 16px;}
.kicker,label{display:block;color:#cbd5e1;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin:0 0 8px;}
.deviceRow{display:flex;gap:10px;align-items:center}
.deviceCode{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(148,163,184,.19);border-radius:18px;padding:13px 11px;text-align:center;font-size:16px;font-weight:950;letter-spacing:1.2px;user-select:all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.copyBtn{width:92px;height:48px;border:0;border-radius:17px;background:rgba(10,132,255,.15);color:#6db8ff;font-size:13px;font-weight:950;}
label{margin:14px 0 8px}
input{width:100%;height:56px;border:0;outline:0;border-radius:19px;background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px rgba(148,163,184,.20);color:#fff;text-align:center;text-transform:uppercase;font-size:17px;font-weight:900;letter-spacing:.6px;padding:0 15px;}
input::placeholder{color:rgba(203,213,225,.45)}
.primary{width:100%;height:58px;border:0;border-radius:20px;margin-top:18px;background:linear-gradient(180deg,#1395ff,#0074e8);color:#fff;font-size:18px;font-weight:950;box-shadow:0 18px 34px rgba(10,132,255,.25);}
.secondary{width:100%;height:46px;border:0;border-radius:17px;margin-top:9px;background:transparent;color:#8ea0ba;font-size:13px;font-weight:850;}
.msg{min-height:22px;text-align:center;margin-top:13px;font-size:13px;line-height:1.35;color:#9aa7bd;font-weight:850;}
.msg.good{color:#5ee0a5}.msg.bad{color:#ff8a94}
.hint{text-align:center;color:#7c8aa3;font-size:12px;line-height:1.45;margin-top:12px;font-weight:700;}
.hidden{display:none!important}
.licenseInfo{margin-top:12px;padding:13px;border-radius:20px;background:rgba(32,201,151,.08);border:1px solid rgba(32,201,151,.18);font-size:13px;color:#c9ffea;text-align:center;font-weight:800;line-height:1.45;}
@media(max-width:380px){.card{padding:22px 18px;border-radius:30px}h1{font-size:29px}.deviceCode{font-size:14px}.copyBtn{width:82px}}
</style>
</head>
<body>
<div class="card" id="gateCard">
  <div class="logo">E<span>X</span></div>
  <h1>Elevator<span>X</span></h1>
  <div class="sub">Bu cihazda kullanıma başlamak için lisans no ve bu cihaza özel aktivasyon kodu gerekiyor.</div>

  <div id="activeInfo" class="licenseInfo hidden"></div>

  <div class="deviceBox">
    <div class="kicker">Bu cihazın kodu</div>
    <div class="deviceRow">
      <div class="deviceCode" id="deviceCode">—</div>
      <button class="copyBtn" id="copyBtn" type="button">Kopyala</button>
    </div>
  </div>

  <label for="licenseNo">Lisans No</label>
  <input id="licenseNo" placeholder="EX-001" autocomplete="off" inputmode="text">

  <label for="activationCode">Aktivasyon Kodu</label>
  <input id="activationCode" placeholder="Y01-XXXX-XXXX-XXXX" autocomplete="off" inputmode="text">

  <button class="primary" id="activateBtn" type="button">Aktifleştir</button>
  <button class="secondary" id="resetBtn" type="button">Cihaz kodunu yenile</button>
  <div class="msg" id="msg"></div>
  <div class="hint">Müşteri lisans no + cihaz kodunu sana gönderir. Sen admin dosyasından süre seçip aktivasyon kodu üretirsin.</div>
</div>
<script>
(function(){
  var APP_FILE='app.html';
  var STORE_KEY='EX_LICENSE_V1475';
  var DEVICE_KEY='EX_DEVICE_SEED_V1475';
  var SECRET_PARTS=[69,88,124,65,89,124,76,73,70,84,124,50,48,50,54,124,79,70,70,76,73,78,69,124,86,49];
  var DURATION_MS={D30:30*24*60*60*1000,M06:183*24*60*60*1000,Y01:365*24*60*60*1000,LFT:null};
  function secret(){return SECRET_PARTS.map(function(c){return String.fromCharCode(c);}).join('');}
  function norm(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
  function pretty(v){v=norm(v);return v.replace(/(.{4})/g,'$1-').replace(/-$/,'');}
  function hash32(str){var h=2166136261>>>0;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}h^=h>>>13;h=Math.imul(h,0x5bd1e995)>>>0;h^=h>>>15;return h>>>0;}
  function code36(num,len){var s=(num>>>0).toString(36).toUpperCase();while(s.length<len)s='0'+s;return s.slice(-len);}
  function seedNew(){try{var a=new Uint32Array(4);crypto.getRandomValues(a);return Array.prototype.join.call(a,'-')+'-'+Date.now();}catch(e){return Date.now()+'-'+Math.random()+'-'+screen.width+'x'+screen.height;}}
  function getSeed(){var s=localStorage.getItem(DEVICE_KEY);if(!s){s=seedNew();localStorage.setItem(DEVICE_KEY,s);}return s;}
  function deviceCode(){var raw=getSeed()+'|'+(navigator.userAgent||'')+'|'+screen.width+'x'+screen.height+'|'+(navigator.language||'');return code36(hash32(raw+'|A'),4)+'-'+code36(hash32(raw+'|B'),4)+'-'+code36(hash32(raw+'|C'),4);}
  function makeActivation(license,device,duration){var L=norm(license),D=norm(device),T=norm(duration).slice(0,3);if(!DURATION_MS.hasOwnProperty(T))return '';var base=secret()+'|'+L+'|'+D+'|'+T;return T+'-'+code36(hash32(base+'|1'),4)+'-'+code36(hash32(base+'|2'),4)+'-'+code36(hash32(base+'|3'),4);}
  function durationFromKey(key){return norm(key).slice(0,3);}
  function expiryText(ts){if(!ts)return 'Süresiz';try{return new Date(Number(ts)).toLocaleDateString('tr-TR');}catch(e){return '-';}}
  function goApp(){var u=new URL(APP_FILE, location.href);u.searchParams.set('v','1475');location.replace(u.href);}
  function getStored(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null');}catch(e){return null;}}
  function validStored(){var rec=getStored();if(!rec||!rec.license||!rec.device||!rec.key||!rec.duration)return false;if(norm(rec.device)!==norm(deviceCode()))return false;if(makeActivation(rec.license,rec.device,rec.duration)!==String(rec.key||'').toUpperCase())return false;if(rec.expiresAt&&Date.now()>Number(rec.expiresAt))return false;return true;}
  function msg(t,c){var m=document.getElementById('msg');if(m){m.textContent=t||'';m.className='msg '+(c||'');}}
  function setDevice(){var d=document.getElementById('deviceCode');if(d)d.textContent=deviceCode();}
  function activate(){var lic=document.getElementById('licenseNo').value;var key=String(document.getElementById('activationCode').value||'').toUpperCase().trim();var dur=durationFromKey(key);if(!norm(lic)){msg('Lisans no girmen gerekiyor.','bad');return;}if(!DURATION_MS.hasOwnProperty(dur)){msg('Aktivasyon kodu geçersiz görünüyor.','bad');return;}var dev=deviceCode();var expected=makeActivation(lic,dev,dur);if(norm(key)!==norm(expected)){msg('Bu aktivasyon kodu bu cihaz için geçerli değil.','bad');return;}var ms=DURATION_MS[dur];var exp=ms===null?null:(Date.now()+ms);var rec={license:pretty(lic),device:dev,duration:dur,key:expected,activatedAt:Date.now(),expiresAt:exp};localStorage.setItem(STORE_KEY,JSON.stringify(rec));msg('Aktivasyon tamamlandı. Açılıyor...','good');setTimeout(goApp,700);}
  function init(){setDevice();if(validStored()){var rec=getStored();var info=document.getElementById('activeInfo');if(info){info.classList.remove('hidden');info.textContent='Aktif lisans: '+rec.license+' • Geçerlilik: '+expiryText(rec.expiresAt);}setTimeout(goApp,550);return;}var rec=getStored();if(rec&&rec.expiresAt&&Date.now()>Number(rec.expiresAt))msg('Aktivasyon süresi dolmuş. Yeni kod gerekiyor.','bad');document.getElementById('activateBtn').onclick=activate;document.getElementById('copyBtn').onclick=function(){var dc=deviceCode();if(navigator.clipboard)navigator.clipboard.writeText(dc).then(function(){msg('Cihaz kodu kopyalandı.','good');}).catch(function(){msg('Cihaz kodu: '+dc,'good');});else msg('Cihaz kodu: '+dc,'good');};document.getElementById('resetBtn').onclick=function(){if(confirm('Cihaz kodu yenilensin mi? Eski aktivasyon geçersiz olur.')){localStorage.removeItem(STORE_KEY);localStorage.removeItem(DEVICE_KEY);setDevice();msg('Yeni cihaz kodu oluşturuldu.','good');}};['licenseNo','activationCode'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')activate();});});}
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
